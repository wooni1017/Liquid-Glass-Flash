<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18a0fb" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0055ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7b61ff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="lipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="causticGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glassGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Backing Glass Plate -->
  <rect x="20" y="20" width="88" height="88" rx="26" ry="26" fill="url(#bgGrad)" filter="url(#glassGlow)"/>

  <!-- Inner Caustic Shade -->
  <path d="M 46 20 C 31.64 20 20 31.64 20 46 L 20 82 C 20 96.36 31.64 108 46 108 L 82 108 C 96.36 108 108 96.36 108 82 Z" 
        fill="url(#causticGrad)" opacity="0.6"/>

  <!-- Refraction Waves / Lens Prism Lines -->
  <path d="M 32 44 Q 64 36 96 44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 32 64 Q 64 54 96 64" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.65"/>
  <path d="M 36 84 Q 64 74 92 84" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.45"/>

  <!-- 1px Specular Lip Bevel Highlight -->
  <rect x="21" y="21" width="86" height="86" rx="25" ry="25" fill="none" stroke="url(#lipGrad)" stroke-width="2"/>

  <!-- Top-left Light Point Indicator -->
  <circle cx="34" cy="34" r="3.5" fill="#ffffff" opacity="0.95"/>
</svg>
